<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convert — 문서 변환기</title>
  <meta name="description" content="PDF↔이미지·HWPX·문서 PDF 변환을 브라우저에서 처리하는 문서 변환기" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.13.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root{--ink:#111318;--muted:#6b7280;--line:#e5e7eb;--paper:#fff;--bg:#f4f6f8;--red:#e31b23;--red2:#ff4450;--soft:#fff1f2}
    *{box-sizing:border-box}
    body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:radial-gradient(circle at top left,#fff 0,#f4f6f8 38%,#eef1f5 100%);color:var(--ink)}
    button,input{font:inherit}
    .shell{max-width:1180px;margin:0 auto;padding:34px 20px 80px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:32px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.04em;font-size:22px}
    .mark{width:36px;height:36px;border-radius:10px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:900}
    .privacy{font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:999px}
    .hero{background:#111318;color:#fff;border-radius:30px;padding:42px;position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(17,19,24,.18)}
    .hero:after{content:"";position:absolute;width:340px;height:340px;border:70px solid var(--red);border-radius:50%;right:-145px;top:-170px;opacity:.95}
    .eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:#ffb8bd;text-transform:uppercase}
    h1{font-size:clamp(36px,6vw,72px);line-height:1.02;letter-spacing:-.055em;margin:14px 0 18px;max-width:760px;text-wrap:balance}
    .hero p{max-width:650px;color:#c8cdd5;line-height:1.7;margin:0;font-size:16px;word-break:keep-all}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
    .tool{border:1px solid var(--line);background:rgba(255,255,255,.96);border-radius:22px;padding:22px;text-align:left;cursor:pointer;transition:.18s ease;min-height:172px;position:relative}
    .tool:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(0,0,0,.08);border-color:#d1d5db}
    .tool.active{outline:3px solid rgba(227,27,35,.15);border-color:#f3a8ac}
    .tool .icon{width:44px;height:44px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:20px;margin-bottom:22px}
    .tool h2{font-size:22px;margin:0 0 8px;letter-spacing:-.04em}
    .tool p{margin:0;color:var(--muted);line-height:1.55;font-size:14px;word-break:keep-all}
    .panel{margin-top:18px;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 14px 34px rgba(0,0,0,.05)}
    .panel-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}
    .panel-head h3{margin:0 0 7px;font-size:25px;letter-spacing:-.04em}
    .panel-head p{margin:0;color:var(--muted);line-height:1.6;font-size:14px;word-break:keep-all}
    .drop{border:2px dashed #cfd4dc;border-radius:18px;padding:32px;text-align:center;background:#fafbfc;transition:.18s}
    .drop.drag{background:#fff2f3;border-color:var(--red)}
    .file-label{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}
    .file-label input{display:none}
    .hint{margin-top:12px;font-size:13px;color:var(--muted)}
    .options{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:16px}
    .options input,.options select{padding:9px 11px;border:1px solid #d8dce2;border-radius:10px;background:#fff}
    .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
    .btn{border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer;background:var(--red);color:#fff}
    .btn.secondary{background:#e9edf2;color:#171a1f}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .status{display:none;margin-top:18px;padding:14px 16px;border-radius:13px;background:#f1f5f9;color:#334155;line-height:1.55;font-size:14px}
    #result{display:grid;gap:18px;margin-top:20px}
    .page-card{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}
    .page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-weight:800}
    canvas{width:100%;height:auto;border:1px solid #e5e7eb;border-radius:12px;background:#fff}
    .preview-doc{position:absolute;left:-99999px;top:0;width:794px;background:#fff;color:#111;padding:42px;font-family:"Noto Sans KR",Arial,sans-serif}
    .preview-doc table{border-collapse:collapse;width:100%;font-size:12px}
    .preview-doc td,.preview-doc th{border:1px solid #bbb;padding:5px}
    .preview-doc img{max-width:100%}
    .note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6;text-align:center}
    .hidden{display:none!important}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.hero{padding:30px}.panel{padding:18px}.privacy{display:none}.panel-head{display:block}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><div class="mark">C</div> Convert</div>
      <div class="privacy">파일은 가능한 범위에서 브라우저 내부에서 처리됩니다.</div>
    </header>

    <section class="hero">
      <div class="eyebrow">Document converter</div>
      <h1>문서를 필요한 형태로,<br>복잡함 없이.</h1>
      <p>PDF를 이미지나 HWPX로 바꾸고, 여러 문서 형식을 PDF로 정리합니다. 아래 세 기능 중 하나를 선택하세요.</p>
    </section>

    <section class="grid" aria-label="변환 기능 선택">
      <button class="tool active" data-mode="png">
        <div class="icon">▧</div><h2>PDF → PNG</h2>
        <p>페이지별 고해상도 PNG 변환 및 개별·ZIP 다운로드</p>
      </button>
      <button class="tool" data-mode="hwpx">
        <div class="icon">한</div><h2>PDF → HWPX</h2>
        <p>PDF 페이지 모습을 유지한 이미지 기반 HWPX 문서 생성</p>
      </button>
      <button class="tool" data-mode="pdf">
        <div class="icon">PDF</div><h2>문서 → PDF</h2>
        <p>DOCX, Excel, HWP/HWPX, TXT, MD, HTML, 이미지 파일을 PDF로</p>
      </button>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div><h3 id="panelTitle">PDF → PNG</h3><p id="panelDesc">PDF를 선택하면 페이지별 PNG를 생성합니다.</p></div>
      </div>
      <div class="drop" id="dropZone">
        <label class="file-label">파일 선택<input type="file" id="fileInput" /></label>
        <div class="hint" id="acceptHint">PDF 파일</div>
        <div class="options" id="pngOptions">
          <label>이미지 품질 배율 <input type="number" id="scale" value="2" min="1" max="4" step="0.5" /></label>
        </div>
        <div class="actions">
          <button class="btn" id="convertBtn" disabled>변환하기</button>
          <button class="btn secondary" id="clearBtn" disabled>초기화</button>
        </div>
        <div class="status" id="status"></div>
        <div class="note" id="modeNote">페이지가 많거나 고해상도 PDF는 처리 시간이 늘어날 수 있습니다.</div>
      </div>
      <div id="result"></div>
    </section>
  </div>
  <div id="docPreview" class="preview-doc"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const modes={
  png:{title:'PDF → PNG',desc:'PDF를 선택하면 페이지별 PNG를 생성합니다.',accept:'application/pdf,.pdf',hint:'PDF 파일',note:'페이지가 많거나 고해상도 PDF는 처리 시간이 늘어날 수 있습니다.'},
  hwpx:{title:'PDF → HWPX',desc:'PDF 각 페이지를 이미지로 보존해 HWPX 문서로 만듭니다.',accept:'application/pdf,.pdf',hint:'PDF 파일',note:'화면 보존형 변환입니다. HWPX 안의 본문이 원문처럼 완전 편집 가능한 텍스트로 재구성되지는 않습니다.'},
  pdf:{title:'문서 → PDF',desc:'문서 내용을 브라우저에서 읽어 PDF로 변환합니다.',accept:'.docx,.xlsx,.xls,.csv,.txt,.md,.html,.htm,.jpg,.jpeg,.png,.webp,.hwp,.hwpx',hint:'DOCX · XLSX/XLS/CSV · HWP/HWPX · TXT/MD/HTML · JPG/PNG/WebP',note:'복잡한 Word/Excel/HWP 레이아웃은 브라우저 렌더링 특성상 원본과 일부 다를 수 있습니다. PPTX는 현재 지원하지 않습니다.'}
};
let mode='png', selectedFile=null, rendered=[];
const tools=[...document.querySelectorAll('.tool')], input=document.getElementById('fileInput'), btn=document.getElementById('convertBtn'), clear=document.getElementById('clearBtn'), result=document.getElementById('result'), status=document.getElementById('status'), drop=document.getElementById('dropZone'), scale=document.getElementById('scale');

tools.forEach(t=>t.onclick=()=>setMode(t.dataset.mode));
function setMode(next){
  mode=next; tools.forEach(t=>t.classList.toggle('active',t.dataset.mode===mode));
  const m=modes[mode]; document.getElementById('panelTitle').textContent=m.title; document.getElementById('panelDesc').textContent=m.desc; document.getElementById('acceptHint').textContent=m.hint; document.getElementById('modeNote').textContent=m.note; input.accept=m.accept; document.getElementById('pngOptions').classList.toggle('hidden',mode!=='png'); reset();
}
function reset(){input.value='';selectedFile=null;rendered=[];result.innerHTML='';btn.disabled=true;clear.disabled=true;setStatus('',false)}
function setStatus(msg,show=true){status.textContent=msg;status.style.display=show?'block':'none'}
function baseName(n){return n.replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]/g,'_')}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}
function validateFile(f){if(!f)return false;const ext='.'+f.name.split('.').pop().toLowerCase();if(!modes[mode].accept.toLowerCase().includes(ext)){alert('현재 기능에서 지원하지 않는 파일 형식입니다.');return false}return true}
function selectFile(f){if(!validateFile(f))return;selectedFile=f;result.innerHTML='';rendered=[];btn.disabled=false;clear.disabled=false;setStatus('파일 선택 완료: '+f.name)}
input.onchange=e=>selectFile(e.target.files[0]); clear.onclick=reset;
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>selectFile(e.dataTransfer.files[0]));

async function renderPdf(file,quality=2,onPage){
  const pdf=await pdfjsLib.getDocument(new Uint8Array(await file.arrayBuffer())).promise, pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    if(onPage)onPage(i,pdf.numPages);
    const page=await pdf.getPage(i), viewport=page.getViewport({scale:quality}), canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
    canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);
    await page.render({canvasContext:ctx,viewport}).promise; pages.push(canvas);
  }
  return pages;
}
function canvasBlob(canvas,type='image/png',q=.95){return new Promise(r=>canvas.toBlob(r,type,q))}
function canvasData(canvas,type='image/png',q=.92){return canvas.toDataURL(type,q)}

async function pdfToPng(){
  const q=Math.max(1,Math.min(4,Number(scale.value)||2)); result.innerHTML='';
  const pages=await renderPdf(selectedFile,q,(i,n)=>setStatus(i+' / '+n+' 페이지 변환 중...')); rendered=pages;
  pages.forEach((canvas,idx)=>{
    const card=document.createElement('div');card.className='page-card';
    const head=document.createElement('div');head.className='page-head';head.innerHTML='<span>'+(idx+1)+'페이지</span>';
    const one=document.createElement('button');one.className='btn';one.textContent='PNG 다운로드';one.onclick=async()=>downloadBlob(await canvasBlob(canvas),baseName(selectedFile.name)+'_page_'+String(idx+1).padStart(2,'0')+'.png');
    head.appendChild(one);card.appendChild(head);card.appendChild(canvas);result.appendChild(card);
  });
  const all=document.createElement('button');all.className='btn';all.textContent='전체 PNG ZIP 다운로드';all.onclick=async()=>{setStatus('ZIP 파일 생성 중...');const zip=new JSZip();for(let i=0;i<pages.length;i++)zip.file(baseName(selectedFile.name)+'_page_'+String(i+1).padStart(2,'0')+'.png',await canvasBlob(pages[i]));downloadBlob(await zip.generateAsync({type:'blob'}),baseName(selectedFile.name)+'_png.zip');setStatus('변환 완료!')};
  result.prepend(all); setStatus('변환 완료! 페이지별 또는 ZIP으로 저장할 수 있습니다.');
}

async function pdfToHwpx(){
  setStatus('PDF 페이지를 읽는 중...');
  const pages=await renderPdf(selectedFile,1.65,(i,n)=>setStatus(i+' / '+n+' 페이지 준비 중...'));
  const imgs=pages.map((c,i)=>'<p><img src="'+canvasData(c,'image/jpeg',.9)+'" alt="'+(i+1)+'페이지" /></p>').join('');
  setStatus('HWPX 문서를 만드는 중...');
  const lib=await import('https://cdn.jsdelivr.net/npm/@ssabrojs/hwpxjs@0.4.0/dist/browser/hwpxjs.browser.mjs');
  const bytes=await lib.htmlToHwpx(imgs,{title:baseName(selectedFile.name),creator:'Convert'});
  downloadBlob(new Blob([bytes],{type:'application/vnd.hancom.hwpx'}),baseName(selectedFile.name)+'.hwpx');
  setStatus('HWPX 변환 완료! 다운로드를 시작했습니다.');
}

async function hwpxOrHwpToHtml(file){
  const lib=await import('https://cdn.jsdelivr.net/npm/@ssabrojs/hwpxjs@0.4.0/dist/browser/hwpxjs.browser.mjs');
  let bytes=new Uint8Array(await file.arrayBuffer()), hwpxBytes=bytes;
  if(file.name.toLowerCase().endsWith('.hwp')) hwpxBytes=await lib.hwpToHwpx(bytes,{title:baseName(file.name),creator:'Convert'});
  const reader=new lib.HwpxReader(); await reader.loadFromArrayBuffer(hwpxBytes.buffer.slice(hwpxBytes.byteOffset,hwpxBytes.byteOffset+hwpxBytes.byteLength));
  return await reader.extractHtml({renderImages:true,renderTables:true,renderStyles:true,embedImages:true});
}
async function documentToHtml(file){
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='docx'){const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});return r.value}
  if(['xlsx','xls','csv'].includes(ext)){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});return wb.SheetNames.map(n=>'<h2>'+n+'</h2>'+XLSX.utils.sheet_to_html(wb.Sheets[n])).join('<div style="page-break-after:always"></div>')}
  if(ext==='md')return marked.parse(await file.text());
  if(['html','htm'].includes(ext))return await file.text();
  if(ext==='txt')return '<pre style="white-space:pre-wrap;font-family:inherit">'+(await file.text()).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))+'</pre>';
  if(['hwp','hwpx'].includes(ext))return await hwpxOrHwpToHtml(file);
  throw new Error('HTML_CONVERSION_UNSUPPORTED');
}
async function imageToPdf(file){
  const url=URL.createObjectURL(file),img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
  const {jsPDF}=window.jspdf||{}; if(!jsPDF)throw new Error('PDF_ENGINE');
  const orient=img.width>img.height?'l':'p',pdf=new jsPDF({orientation:orient,unit:'mm',format:'a4'}),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),ratio=Math.min((pw-16)/img.width,(ph-16)/img.height),w=img.width*ratio,h=img.height*ratio;
  pdf.addImage(img, file.type.includes('png')?'PNG':'JPEG',(pw-w)/2,(ph-h)/2,w,h);pdf.save(baseName(file.name)+'.pdf');URL.revokeObjectURL(url);
}
async function documentToPdf(){
  const ext=selectedFile.name.split('.').pop().toLowerCase();
  if(['jpg','jpeg','png','webp'].includes(ext)){await imageToPdf(selectedFile);setStatus('PDF 변환 완료!');return}
  setStatus('문서를 읽는 중...');const html=await documentToHtml(selectedFile), box=document.getElementById('docPreview');box.innerHTML='<article>'+html+'</article>';
  await new Promise(r=>setTimeout(r,250));setStatus('PDF를 생성하는 중...');
  await html2pdf().set({margin:10,filename:baseName(selectedFile.name)+'.pdf',image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(box).save();
  box.innerHTML='';setStatus('PDF 변환 완료!');
}
btn.onclick=async()=>{
  if(!selectedFile)return;btn.disabled=true;result.innerHTML='';
  try{if(mode==='png')await pdfToPng();else if(mode==='hwpx')await pdfToHwpx();else await documentToPdf()}
  catch(e){console.error(e);setStatus('변환 중 오류가 발생했습니다. 파일이 암호화되어 있거나 현재 브라우저에서 처리하기 어려운 형식일 수 있습니다.')}
  finally{btn.disabled=false}
};
setMode('png');
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
</body>
</html>
